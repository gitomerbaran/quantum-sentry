[package]
name = "executor"
version = "0.1.0"
edition = "2021"
description = "Quantum Sentinel v2 Executor (gates, stabilization, shadow mode)"

[features]
default = []
onnx = ["dep:ort"]  # Real ONNX inference via OrtInferenceEngine.

[[bin]]
name = "executor"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
logger = { path = "../logger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "time", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
ort = { version = "2.0.0-rc.11", optional = true }

[dev-dependencies]
approx = "0.5"
